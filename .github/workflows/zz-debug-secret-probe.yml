# TEMPORAL: diagnostico del secret CLIENT_SECRET (se elimina tras su uso).
# Imprime longitud, prefijo/sufijo de 2 caracteres y candidatos comunes;
# GitHub enmascara con *** todo lo que coincida con el valor real.

name: Diagnostico temporal del secret (eliminar)

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico sin revelar el valor
        env:
          PROBE: ${{ secrets.CLIENT_SECRET }}
        run: |
          echo "longitud del valor de CLIENT_SECRET: ${#PROBE}"
          echo "primeros 2 caracteres: ${PROBE:0:2}"
          echo "ultimos 2 caracteres: ${PROBE: -2}"
          echo "probe-A (client_id Ov23lidu...): Ov23lidu7f0fKNEIvqbP"
          echo "probe-B (el nombre GITHUB_CLIENT_SECRET): GITHUB_CLIENT_SECRET"
          echo "probe-C (el nombre CLIENT_SECRET): CLIENT_SECRET"
          echo "probe-D (la callback): orbit://oauth/callback"
          echo "probe-E (changeme): changeme"
          echo "probe-F (test12345): test12345"
          echo "probe-G (12345678): 12345678"
          echo "probe-H (github): github"
