# Blueprint de Render para GitHub Orbit Next
# New → Blueprint → elige este repo → rellena las variables → Deploy
services:
  - type: web
    name: orbit-next
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
